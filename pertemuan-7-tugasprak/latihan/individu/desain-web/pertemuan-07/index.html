<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Kursus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="registration-card">

            <div class="form-header">
                <span class="label">PENDAFTARAN KURSUS</span>
                <h1>Form Pendaftaran Kursus</h1>
                <p>Silakan lengkapi data berikut dengan benar.</p>
            </div>

            <!-- Method POST karena data pendaftaran dikirim lewat body request. -->
            <form action="/proses-pendaftaran-kursus" method="post">

                <!-- 1. Input text -->
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <!-- 2. Input email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="nama@email.com" required>
                </div>

                <!-- 3. Input password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           minlength="8" placeholder="Masukkan password" required>
                    <small>Gunakan minimal 8 karakter.</small>
                </div>

                <!-- 4. Input number -->
                <div class="form-group">
                    <label for="umur">Umur</label>
                    <input type="number" id="umur" name="umur"
                           min="10" max="80" placeholder="Contoh: 18">
                </div>

                <!-- 5. Input date -->
                <div class="form-group">
                    <label for="tanggal-mulai">Tanggal Mulai Kursus</label>
                    <input type="date" id="tanggal-mulai" name="tanggal_mulai" required>
                </div>

                <!-- Pilihan kursus -->
                <div class="form-group">
                    <label for="kursus">Pilihan Kursus</label>
                    <select id="kursus" name="kursus" required>
                        <option value="">-- Pilih Kursus --</option>
                        <option value="web">Desain Web</option>
                        <option value="python">Pemrograman Python</option>
                        <option value="database">Basis Data</option>
                    </select>
                </div>

                <!-- 3 jenis button: submit, reset, button -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Daftar</button>
                    <button type="reset" class="btn btn-reset">Reset</button>
                    <button type="button" class="btn btn-secondary">Bantuan</button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
