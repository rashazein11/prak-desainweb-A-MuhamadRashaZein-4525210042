<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Penerimaan Mahasiswa Baru</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="registration-card">

            <div class="form-header">
                <span class="label">PENERIMAAN MAHASISWA BARU</span>
                <h1>Form Calon Mahasiswa</h1>
                <p>Prototipe form, siap diintegrasikan dengan backend.</p>
            </div>

            <!-- Method POST karena data pendaftaran (termasuk password) dikirim lewat body request. -->
            <form action="/proses-penerimaan" method="post">

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           minlength="8" placeholder="Masukkan password" required>
                    <small>Gunakan minimal 8 karakter.</small>
                </div>

                <div class="form-group">
                    <label for="nilai">Nilai</label>
                    <input type="number" id="nilai" name="nilai"
                           min="0" max="100" step="0.01" placeholder="Contoh: 85" required>
                </div>

                <div class="form-group">
                    <label for="tanggal-lahir">Tanggal Lahir</label>
                    <input type="date" id="tanggal-lahir" name="tanggal_lahir" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Kirim</button>
                    <button type="reset" class="btn btn-reset">Reset</button>
                    <button type="button" class="btn btn-secondary">Kembali</button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
